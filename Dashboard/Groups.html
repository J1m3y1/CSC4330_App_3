<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groups — Fantasi</title>

<link rel="stylesheet" href="https://use.typekit.net/ija6lho.css">

<style>
  :root{
    --noir:#0B0A0C; --noir-soft:#100E11; --emerald:#0F241C;
    --gold:#C7A65C; --gold-bright:#E4C687; --gold-dim:#7C6636;
    --silver:#A6ABB1; --silver-bright:#D4D7DB; --silver-dim:#5E6267;
    --bordeaux:#4E1220; --bordeaux-bright:#711A2E;
    --cream:#F2ECDF; --smoke:#8D8579; --smoke-dim:#5C564C;
    --line: rgba(199,166,92,0.14); --line-strong: rgba(199,166,92,0.30);
    --online: #7FBF8F;
    --font-serif: elina, sans-serif;
    --font-display: the-seasons, sans-serif;
    --font-header: garamond-premier-pro-display, serif;
    --font-sans: garamond-premier-pro-display, serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--noir); color:var(--cream);
    font-family:var(--font-serif); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2{ font-family:var(--font-display); font-style:italic; font-weight:300; margin:0; }
  h3{ font-family:var(--font-serif); font-weight:400; margin:0; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::selection{ background:var(--gold-dim); color:var(--noir); }

  .eyebrow{
    font-family:var(--font-header); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 24px;
    font-family:var(--font-sans); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:500;
    border:1px solid var(--gold); border-radius:999px; transition:transform .3s ease, background .3s ease, border-color .3s ease, color .3s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn-gold{ background:var(--gold); color:var(--noir); }
  .btn-gold:hover{ background:var(--gold-bright); border-color:var(--gold-bright); }
  .btn-line{ background:transparent; color:var(--cream); border-color:var(--line-strong); }
  .btn-line:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-small{ padding:8px 16px; font-size:10px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  .luxury-grain{
    position:fixed; inset:0; z-index:9990; pointer-events:none;
    opacity:0.04; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex-shrink:0; background:var(--noir-soft); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-section{ padding:22px 20px; border-bottom:1px solid var(--line); }
  .sidebar-section h4{
    font-family:var(--font-sans); font-size:10px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:500; margin-bottom:14px;
  }
  .sidebar-field{ margin-bottom:14px; }
  .sidebar-field label{
    display:block; font-family:var(--font-sans); font-size:10.5px; letter-spacing:0.04em;
    color:var(--smoke); margin-bottom:6px;
  }
  .sidebar-field select, .sidebar-field input{
    appearance:none; -webkit-appearance:none; color-scheme:dark;
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line-strong); border-radius:6px;
    padding:9px 12px; color:var(--cream); font-family:var(--font-sans); font-size:12.5px; outline:none;
  }
  .sidebar-field select option{ background:var(--noir-soft); }
  .sidebar-toggle-list{ display:flex; flex-direction:column; gap:2px; }
  .sidebar-toggle-item{
    display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:5px;
    font-family:var(--font-sans); font-size:12.5px; color:var(--smoke); cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .sidebar-toggle-item:hover{ background:rgba(199,166,92,0.05); color:var(--cream); }
  .sidebar-toggle-item.active{ background:rgba(199,166,92,0.09); color:var(--gold-bright); }

  .sidebar-foot{ padding:18px 16px; border-top:1px solid var(--line); margin-top:auto; }
  .mini-account{ display:flex; align-items:center; gap:11px; }
  .mini-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-size:15px; color:var(--noir);
  }
  .mini-account-name{ font-family:var(--font-sans); font-size:13px; color:var(--cream); }
  .mini-account-tier{ font-family:var(--font-sans); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gold); margin-top:1px; }

  .main{ flex:1; min-width:0; padding:44px 56px 80px; }
  .main-inner{ max-width:1160px; }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
  .page-head h1{ font-size:32px; margin-bottom:6px; }
  .page-head p{ font-family:var(--font-sans); font-size:14px; color:var(--smoke); }

  .empty{ font-family:var(--font-sans); font-size:13px; color:var(--smoke-dim); padding:30px 0; text-align:center; }

  .group-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; margin-bottom:36px; }
  .group-card{
    border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; background:var(--noir-soft);
    transition:transform .3s cubic-bezier(.2,.6,.2,1), border-color .3s ease, box-shadow .3s ease;
    display:flex; flex-direction:column;
  }
  .group-card:hover{ transform:translateY(-3px); border-color:var(--gold-dim); box-shadow:0 20px 40px rgba(0,0,0,0.35); }
  .group-cover{
    height:96px; background:linear-gradient(135deg, rgba(199,166,92,0.18), rgba(15,36,28,0.6));
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .group-cover-fill{ font-family:var(--font-display); font-style:italic; font-size:26px; color:var(--gold-dim); }
  .group-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .group-cat{ font-family:var(--font-sans); font-size:9.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--gold-dim); }
  .group-name{ font-size:17px; color:var(--cream); cursor:pointer; }
  .group-name:hover{ color:var(--gold-bright); }
  .group-meta{ font-family:var(--font-sans); font-size:11.5px; color:var(--smoke); }
  .group-desc{ font-family:var(--font-sans); font-size:12.5px; color:var(--smoke); line-height:1.55; flex:1; }
  .group-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .group-count{ font-family:var(--font-sans); font-size:11px; color:var(--smoke-dim); }

  .create-bar{ display:flex; justify-content:flex-end; margin-bottom:18px; }

  /* create modal */
  .modal-backdrop{
    position:fixed; inset:0; z-index:400; background:rgba(11,10,12,0.75); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    width:100%; max-width:460px; background:var(--noir-soft); border:1px solid var(--line-strong);
    border-radius:10px; padding:28px; box-shadow:0 40px 90px rgba(0,0,0,0.55);
  }
  .modal h2{ font-size:22px; margin-bottom:18px; }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{ display:block; font-family:var(--font-sans); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--smoke-dim); margin-bottom:6px; }
  .modal-field input, .modal-field select, .modal-field textarea{
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line-strong); border-radius:6px;
    padding:10px 12px; color:var(--cream); font-family:var(--font-sans); font-size:13px; outline:none; resize:vertical;
  }
  .modal-field select option{ background:var(--noir-soft); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .load-more{ display:flex; justify-content:center; }

  @media (max-width:1150px){ .group-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:900px){
    .sidebar{ display:none; }
    .main{ padding:32px 22px 60px; }
    .group-grid{ grid-template-columns:1fr; }
  }
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="api-base" content="/api">
<script src="/js/fantasi-api.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasi">
<link rel="apple-touch-icon" href="/LandingPage/videos/fantasi-logo-gold.png">
</head>
<body>

<div class="luxury-grain"></div>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Filter</h4>
      <div class="sidebar-field">
        <label for="filter-category">Category</label>
        <select id="filter-category"><option value="">All categories</option></select>
      </div>
      <div class="sidebar-field">
        <label for="filter-state">State</label>
        <select id="filter-state"><option value="">Any state</option></select>
      </div>
      <div class="sidebar-field">
        <label for="filter-q">Search</label>
        <input id="filter-q" type="text" placeholder="Group name…">
      </div>
    </div>
    <div class="sidebar-section">
      <h4>My Groups</h4>
      <div class="sidebar-toggle-list">
        <div class="sidebar-toggle-item active" data-mine="">All groups</div>
        <div class="sidebar-toggle-item" data-mine="owned">Owned by me</div>
        <div class="sidebar-toggle-item" data-mine="joined">Joined</div>
      </div>
    </div>

    <div class="sidebar-foot">
      <div class="mini-account">
        <div class="mini-avatar"></div>
        <div>
          <div class="mini-account-name">Loading…</div>
          <div class="mini-account-tier"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">

      <div class="page-head">
        <div>
          <span class="eyebrow">Community</span>
          <h1 style="margin-top:10px;">Groups</h1>
          <p>Find communities built around your interests and where you live.</p>
        </div>
      </div>

      <div class="create-bar">
        <button type="button" class="btn btn-gold" id="create-group-btn" hidden>Create Group</button>
      </div>

      <div class="group-grid" id="group-grid"></div>
      <p id="groups-empty" class="empty" style="display:none;">No groups match yet. Try widening your filters, or be the first to create one.</p>

      <div class="load-more">
        <button type="button" class="btn btn-line" id="load-more-btn" hidden>Load More</button>
      </div>

    </div>
  </main>
</div>

<div class="modal-backdrop" id="create-modal" hidden>
  <div class="modal">
    <h2>Create a Group</h2>
    <div class="modal-field">
      <label for="cg-name">Name</label>
      <input id="cg-name" type="text" maxlength="80" placeholder="Group name">
    </div>
    <div class="modal-field">
      <label for="cg-category">Category</label>
      <select id="cg-category"><option value="">No category</option></select>
    </div>
    <div class="modal-field">
      <label for="cg-state">State</label>
      <select id="cg-state"><option value="">No state</option></select>
    </div>
    <div class="modal-field">
      <label for="cg-city">City</label>
      <select id="cg-city" disabled><option value="">City…</option></select>
    </div>
    <div class="modal-field">
      <label for="cg-description">Description</label>
      <textarea id="cg-description" rows="4" maxlength="1000" placeholder="What's this group about?"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-line btn-small" id="cg-cancel">Cancel</button>
      <button type="button" class="btn btn-gold btn-small" id="cg-submit">Create</button>
    </div>
  </div>
</div>

<script>
(async () => {
  if (!window.FantasiAPI) { window.location.href = '/SignInProcess/SignIn.html'; return; }
  const { api, initDashboard, showToast, US_STATES_CITIES, wireLocationSelects } = window.FantasiAPI;

  const user = await initDashboard();
  if (!user) return;

  const CATEGORIES = [
    'Social & Friendship', 'Events & Meetups', 'Discussion & Advice', 'Education & Munches',
    'Travel Companions', 'Arts & Lifestyle', 'Local Community', 'Other',
  ];

  const grid       = document.getElementById('group-grid');
  const emptyMsg   = document.getElementById('groups-empty');
  const loadMore   = document.getElementById('load-more-btn');
  const categoryEl = document.getElementById('filter-category');
  const stateEl    = document.getElementById('filter-state');
  const qEl        = document.getElementById('filter-q');
  const createBtn  = document.getElementById('create-group-btn');

  CATEGORIES.forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    categoryEl.appendChild(opt);
    const opt2 = document.createElement('option'); opt2.value = c; opt2.textContent = c;
    document.getElementById('cg-category').appendChild(opt2);
  });
  Object.keys(US_STATES_CITIES).forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = s;
    stateEl.appendChild(opt);
  });

  if (['gold', 'black'].includes(user.membership_tier)) createBtn.hidden = false;

  let page = 1, totalPages = 1, mineFilter = '';
  const params = new URLSearchParams(window.location.search);
  if (params.get('create') === '1' && !createBtn.hidden) openModal();

  function currentFilters() {
    const f = { page, limit: 18 };
    if (categoryEl.value) f.category = categoryEl.value;
    if (stateEl.value)    f.state    = stateEl.value;
    if (qEl.value.trim()) f.q        = qEl.value.trim();
    return f;
  }

  function buildCard(group) {
    const card = document.createElement('div');
    card.className = 'group-card';
    const open = () => { window.location.href = `/Dashboard/Group.html?id=${group.id}`; };

    const cover = document.createElement('div');
    cover.className = 'group-cover';
    cover.style.cursor = 'pointer';
    cover.addEventListener('click', open);
    const fill = document.createElement('div');
    fill.className = 'group-cover-fill';
    fill.textContent = (group.name || '?').charAt(0).toUpperCase();
    cover.appendChild(fill);

    const body = document.createElement('div');
    body.className = 'group-body';

    if (group.category) {
      const cat = document.createElement('div'); cat.className = 'group-cat'; cat.textContent = group.category;
      body.appendChild(cat);
    }
    const name = document.createElement('h3'); name.className = 'group-name'; name.textContent = group.name;
    name.addEventListener('click', open);
    body.appendChild(name);

    if (group.location || group.state) {
      const meta = document.createElement('div'); meta.className = 'group-meta';
      meta.textContent = group.location || group.state;
      body.appendChild(meta);
    }

    const desc = document.createElement('p'); desc.className = 'group-desc';
    desc.textContent = group.description || 'No description yet.';
    body.appendChild(desc);

    const foot = document.createElement('div'); foot.className = 'group-foot';
    const count = document.createElement('span'); count.className = 'group-count';
    count.textContent = `${group.member_count} member${group.member_count === 1 ? '' : 's'}`;
    foot.appendChild(count);

    const joinBtn = document.createElement('button');
    joinBtn.type = 'button';
    joinBtn.className = 'btn btn-small ' + (group.is_member ? 'btn-line' : 'btn-gold');
    joinBtn.textContent = group.is_member ? 'Joined' : 'Join';
    joinBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (group.is_member) { window.location.href = `/Dashboard/Group.html?id=${group.id}`; return; }
      joinBtn.disabled = true;
      const { ok, data } = await api.groups.join(group.id);
      if (ok) { group.is_member = true; joinBtn.textContent = 'Joined'; joinBtn.className = 'btn btn-small btn-line'; }
      else showToast(data?.error || 'Could not join group.', 'error');
      joinBtn.disabled = false;
    });
    foot.appendChild(joinBtn);
    body.appendChild(foot);

    card.append(cover, body);
    return card;
  }

  async function loadPage(reset) {
    if (reset) { page = 1; grid.innerHTML = ''; }
    const { ok, data } = await api.groups.list(currentFilters());
    if (!ok) { showToast(data?.error || 'Could not load groups.', 'error'); return; }

    totalPages = data.pagination.pages;
    let groups = data.groups;
    if (mineFilter === 'owned')  groups = groups.filter(g => g.my_role === 'owner');
    if (mineFilter === 'joined') groups = groups.filter(g => g.is_member && g.my_role !== 'owner');
    groups.forEach(g => grid.appendChild(buildCard(g)));

    emptyMsg.style.display = grid.children.length ? 'none' : 'block';
    loadMore.hidden = page >= totalPages;
  }

  [categoryEl, stateEl].forEach(el => el.addEventListener('change', () => loadPage(true)));
  let qDebounce;
  qEl.addEventListener('input', () => { clearTimeout(qDebounce); qDebounce = setTimeout(() => loadPage(true), 400); });

  document.querySelectorAll('.sidebar-toggle-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-toggle-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      mineFilter = item.dataset.mine;
      loadPage(true);
    });
  });

  loadMore.addEventListener('click', () => { page += 1; loadPage(false); });

  // ── Create modal ──────────────────────────────────────────────────────────
  const modal = document.getElementById('create-modal');
  const getCityLocation = wireLocationSelects(document.getElementById('cg-state'), document.getElementById('cg-city'));
  function openModal() { modal.hidden = false; }
  function closeModal() { modal.hidden = true; }
  createBtn.addEventListener('click', openModal);
  document.getElementById('cg-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  document.getElementById('cg-submit').addEventListener('click', async () => {
    const name = document.getElementById('cg-name').value.trim();
    if (name.length < 2) { showToast('Group name must be at least 2 characters.', 'error'); return; }
    const category = document.getElementById('cg-category').value;
    const state = document.getElementById('cg-state').value;
    const location = getCityLocation();
    const description = document.getElementById('cg-description').value.trim();

    const submitBtn = document.getElementById('cg-submit');
    submitBtn.disabled = true;
    const { ok, data } = await api.groups.create({
      name, category: category || undefined, state: state || undefined,
      location: location || undefined, description: description || undefined,
    });
    submitBtn.disabled = false;
    if (ok) { window.location.href = `/Dashboard/Group.html?id=${data.id}`; }
    else showToast(data?.error || 'Could not create group.', 'error');
  });

  loadPage(true);
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
