<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Fantasi</title>

<link rel="stylesheet" href="https://use.typekit.net/ija6lho.css">

<style>
  :root{
    --noir:#0B0A0C; --noir-soft:#100E11; --emerald:#0F241C;
    --gold:#C7A65C; --gold-bright:#E4C687; --gold-dim:#7C6636;
    --silver:#A6ABB1; --silver-bright:#D4D7DB; --silver-dim:#5E6267;
    --bordeaux:#4E1220; --bordeaux-bright:#711A2E;
    --cream:#F2ECDF; --smoke:#8D8579; --smoke-dim:#5C564C;
    --line: rgba(199,166,92,0.14); --line-strong: rgba(199,166,92,0.30);
    --online: #7FBF8F;
    --font-serif: elina, sans-serif;
    --font-display: the-seasons, sans-serif;
    --font-header: garamond-premier-pro-display, serif;
    --font-sans: garamond-premier-pro-display, serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--noir); color:var(--cream);
    font-family:var(--font-serif); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2{ font-family:var(--font-display); font-style:italic; font-weight:300; margin:0; }
  h3{ font-family:var(--font-serif); font-weight:400; margin:0; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::selection{ background:var(--gold-dim); color:var(--noir); }

  .eyebrow{
    font-family:var(--font-header); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 24px;
    font-family:var(--font-sans); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:500;
    border:1px solid var(--gold); border-radius:999px; transition:transform .3s ease, background .3s ease, border-color .3s ease, color .3s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn-gold{ background:var(--gold); color:var(--noir); }
  .btn-gold:hover{ background:var(--gold-bright); border-color:var(--gold-bright); }
  .btn-line{ background:transparent; color:var(--cream); border-color:var(--line-strong); }
  .btn-line:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-small{ padding:8px 16px; font-size:10px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  .luxury-grain{
    position:fixed; inset:0; z-index:9990; pointer-events:none;
    opacity:0.04; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex-shrink:0; background:var(--noir-soft); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-section{ padding:22px 20px; border-bottom:1px solid var(--line); }
  .sidebar-section h4{
    font-family:var(--font-sans); font-size:10px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:500; margin-bottom:14px;
  }
  .sidebar-field{ margin-bottom:14px; }
  .sidebar-field label{
    display:block; font-family:var(--font-sans); font-size:10.5px; letter-spacing:0.04em;
    color:var(--smoke); margin-bottom:6px;
  }
  .sidebar-field select, .sidebar-field input{
    appearance:none; -webkit-appearance:none; color-scheme:dark;
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line-strong); border-radius:6px;
    padding:9px 12px; color:var(--cream); font-family:var(--font-sans); font-size:12.5px; outline:none;
  }
  .sidebar-field select option{ background:var(--noir-soft); }
  .sidebar-toggle-list{ display:flex; flex-direction:column; gap:2px; }
  .sidebar-toggle-item{
    display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:5px;
    font-family:var(--font-sans); font-size:12.5px; color:var(--smoke); cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .sidebar-toggle-item:hover{ background:rgba(199,166,92,0.05); color:var(--cream); }
  .sidebar-toggle-item.active{ background:rgba(199,166,92,0.09); color:var(--gold-bright); }

  .sidebar-foot{ padding:18px 16px; border-top:1px solid var(--line); margin-top:auto; }
  .mini-account{ display:flex; align-items:center; gap:11px; }
  .mini-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-size:15px; color:var(--noir);
  }
  .mini-account-name{ font-family:var(--font-sans); font-size:13px; color:var(--cream); }
  .mini-account-tier{ font-family:var(--font-sans); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gold); margin-top:1px; }

  .main{ flex:1; min-width:0; padding:44px 56px 80px; }
  .main-inner{ max-width:1160px; }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
  .page-head h1{ font-size:32px; margin-bottom:6px; }
  .page-head p{ font-family:var(--font-sans); font-size:14px; color:var(--smoke); }

  .empty{ font-family:var(--font-sans); font-size:13px; color:var(--smoke-dim); padding:30px 0; text-align:center; }
  .create-bar{ display:flex; justify-content:flex-end; margin-bottom:18px; }

  .event-list{ display:flex; flex-direction:column; gap:14px; margin-bottom:36px; }
  .event-card{
    display:flex; gap:20px; border:1px solid var(--line-strong); border-radius:8px; background:var(--noir-soft);
    padding:18px 22px; cursor:pointer; transition:border-color .3s ease, transform .3s ease;
  }
  .event-card:hover{ border-color:var(--gold-dim); transform:translateY(-2px); }
  .event-date-block{
    flex-shrink:0; width:64px; text-align:center; border-right:1px solid var(--line); padding-right:20px;
  }
  .event-date-month{ font-family:var(--font-sans); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); }
  .event-date-day{ font-family:var(--font-display); font-style:italic; font-size:28px; color:var(--gold-bright); line-height:1.1; }
  .event-info{ flex:1; min-width:0; }
  .event-title{ font-size:17px; color:var(--cream); margin-bottom:5px; }
  .event-meta{ font-family:var(--font-sans); font-size:12px; color:var(--smoke); margin-bottom:6px; }
  .event-group-badge{
    display:inline-block; font-family:var(--font-sans); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--gold-dim); border:1px solid var(--line-strong); border-radius:20px; padding:3px 10px;
  }
  .event-counts{ flex-shrink:0; text-align:right; font-family:var(--font-sans); font-size:11.5px; color:var(--smoke-dim); align-self:center; }

  /* create modal (shared pattern with Groups.html) */
  .modal-backdrop{
    position:fixed; inset:0; z-index:400; background:rgba(11,10,12,0.75); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    width:100%; max-width:460px; background:var(--noir-soft); border:1px solid var(--line-strong);
    border-radius:10px; padding:28px; box-shadow:0 40px 90px rgba(0,0,0,0.55); max-height:calc(100vh - 40px); overflow-y:auto;
  }
  .modal h2{ font-size:22px; margin-bottom:18px; }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{ display:block; font-family:var(--font-sans); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--smoke-dim); margin-bottom:6px; }
  .modal-field input, .modal-field select, .modal-field textarea{
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line-strong); border-radius:6px;
    padding:10px 12px; color:var(--cream); font-family:var(--font-sans); font-size:13px; outline:none; resize:vertical;
  }
  .modal-field select option{ background:var(--noir-soft); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .load-more{ display:flex; justify-content:center; }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .main{ padding:32px 22px 60px; }
    .event-card{ flex-direction:column; gap:10px; }
    .event-date-block{ border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:10px; width:auto; text-align:left; display:flex; gap:8px; align-items:baseline; }
  }
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="api-base" content="/api">
<script src="/js/fantasi-api.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasi">
<link rel="apple-touch-icon" href="/LandingPage/videos/fantasi-logo-gold.png">
</head>
<body>

<div class="luxury-grain"></div>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Filter</h4>
      <div class="sidebar-field">
        <label for="filter-state">State</label>
        <select id="filter-state"><option value="">Any state</option></select>
      </div>
      <div class="sidebar-field">
        <label for="filter-from">From</label>
        <input id="filter-from" type="date">
      </div>
      <div class="sidebar-field">
        <label for="filter-to">To</label>
        <input id="filter-to" type="date">
      </div>
      <div class="sidebar-field">
        <label for="filter-q">Search</label>
        <input id="filter-q" type="text" placeholder="Event title…">
      </div>
    </div>
    <div class="sidebar-section">
      <h4>My Events</h4>
      <div class="sidebar-toggle-list">
        <div class="sidebar-toggle-item active" data-mine="">All events</div>
        <div class="sidebar-toggle-item" data-mine="organizing">Organizing</div>
        <div class="sidebar-toggle-item" data-mine="going">Going</div>
        <div class="sidebar-toggle-item" data-mine="interested">Interested</div>
      </div>
    </div>

    <div class="sidebar-foot">
      <div class="mini-account">
        <div class="mini-avatar"></div>
        <div>
          <div class="mini-account-name">Loading…</div>
          <div class="mini-account-tier"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">

      <div class="page-head">
        <div>
          <span class="eyebrow">Community</span>
          <h1 style="margin-top:10px;">Events</h1>
          <p>Munches, meetups, and gatherings happening near you.</p>
        </div>
      </div>

      <div class="create-bar">
        <button type="button" class="btn btn-gold" id="create-event-btn" hidden>Create Event</button>
      </div>

      <div class="event-list" id="event-list"></div>
      <p id="events-empty" class="empty" style="display:none;">No upcoming events match yet. Try widening your filters.</p>

      <div class="load-more">
        <button type="button" class="btn btn-line" id="load-more-btn" hidden>Load More</button>
      </div>

    </div>
  </main>
</div>

<div class="modal-backdrop" id="create-modal" hidden>
  <div class="modal">
    <h2>Create an Event</h2>
    <div class="modal-field">
      <label for="ce-title">Title</label>
      <input id="ce-title" type="text" maxlength="100" placeholder="Event title">
    </div>
    <div class="modal-field">
      <label for="ce-date">Date &amp; time</label>
      <input id="ce-date" type="datetime-local">
    </div>
    <div class="modal-field">
      <label for="ce-state">State</label>
      <select id="ce-state"><option value="">No state</option></select>
    </div>
    <div class="modal-field">
      <label for="ce-city">City</label>
      <select id="ce-city" disabled><option value="">City…</option></select>
    </div>
    <div class="modal-field">
      <label for="ce-group">Hosting group (optional)</label>
      <select id="ce-group"><option value="">No group</option></select>
    </div>
    <div class="modal-field">
      <label for="ce-description">Description</label>
      <textarea id="ce-description" rows="4" maxlength="1500" placeholder="What's happening?"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-line btn-small" id="ce-cancel">Cancel</button>
      <button type="button" class="btn btn-gold btn-small" id="ce-submit">Create</button>
    </div>
  </div>
</div>

<script>
(async () => {
  if (!window.FantasiAPI) { window.location.href = '/SignInProcess/SignIn.html'; return; }
  const { api, initDashboard, showToast, US_STATES_CITIES, wireLocationSelects } = window.FantasiAPI;

  const user = await initDashboard();
  if (!user) return;

  const list       = document.getElementById('event-list');
  const emptyMsg   = document.getElementById('events-empty');
  const loadMore   = document.getElementById('load-more-btn');
  const stateEl    = document.getElementById('filter-state');
  const fromEl     = document.getElementById('filter-from');
  const toEl       = document.getElementById('filter-to');
  const qEl        = document.getElementById('filter-q');
  const createBtn  = document.getElementById('create-event-btn');

  Object.keys(US_STATES_CITIES).forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = s;
    stateEl.appendChild(opt);
  });

  if (['gold', 'black'].includes(user.membership_tier)) createBtn.hidden = false;

  let page = 1, totalPages = 1, mineFilter = '';
  const params = new URLSearchParams(window.location.search);
  if (params.get('create') === '1' && !createBtn.hidden) openModal();

  function currentFilters() {
    const f = { page, limit: 20 };
    if (stateEl.value) f.state = stateEl.value;
    if (fromEl.value)  f.date_from = new Date(fromEl.value).toISOString();
    if (toEl.value)    f.date_to   = new Date(toEl.value).toISOString();
    if (qEl.value.trim()) f.q = qEl.value.trim();
    return f;
  }

  function buildCard(ev) {
    const card = document.createElement('div');
    card.className = 'event-card';
    card.addEventListener('click', () => { window.location.href = `/Dashboard/Event.html?id=${ev.id}`; });

    const d = new Date(ev.event_date);
    const dateBlock = document.createElement('div');
    dateBlock.className = 'event-date-block';
    dateBlock.innerHTML = `<div class="event-date-month">${d.toLocaleDateString(undefined, { month: 'short' })}</div><div class="event-date-day">${d.getDate()}</div>`;

    const info = document.createElement('div');
    info.className = 'event-info';
    const title = document.createElement('div'); title.className = 'event-title'; title.textContent = ev.title;
    const meta = document.createElement('div'); meta.className = 'event-meta';
    meta.textContent = `${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}${ev.location ? ' · ' + ev.location : (ev.state ? ' · ' + ev.state : '')}`;
    info.append(title, meta);
    if (ev.group_name) {
      const badge = document.createElement('span'); badge.className = 'event-group-badge'; badge.textContent = ev.group_name;
      info.appendChild(badge);
    }

    const counts = document.createElement('div');
    counts.className = 'event-counts';
    counts.textContent = `${ev.going_count} going · ${ev.interested_count} interested`;

    card.append(dateBlock, info, counts);
    return card;
  }

  async function loadPage(reset) {
    if (reset) { page = 1; list.innerHTML = ''; }
    const { ok, data } = await api.events.list(currentFilters());
    if (!ok) { showToast(data?.error || 'Could not load events.', 'error'); return; }

    totalPages = data.pagination.pages;
    let events = data.events;
    if (mineFilter === 'organizing')  events = events.filter(e => e.organizer_id === user.id);
    if (mineFilter === 'going')       events = events.filter(e => e.my_status === 'going');
    if (mineFilter === 'interested')  events = events.filter(e => e.my_status === 'interested');
    events.forEach(e => list.appendChild(buildCard(e)));

    emptyMsg.style.display = list.children.length ? 'none' : 'block';
    loadMore.hidden = page >= totalPages;
  }

  [stateEl, fromEl, toEl].forEach(el => el.addEventListener('change', () => loadPage(true)));
  let qDebounce;
  qEl.addEventListener('input', () => { clearTimeout(qDebounce); qDebounce = setTimeout(() => loadPage(true), 400); });

  document.querySelectorAll('.sidebar-toggle-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-toggle-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      mineFilter = item.dataset.mine;
      loadPage(true);
    });
  });

  loadMore.addEventListener('click', () => { page += 1; loadPage(false); });

  // ── Create modal ──────────────────────────────────────────────────────────
  const modal = document.getElementById('create-modal');
  const getCityLocation = wireLocationSelects(document.getElementById('ce-state'), document.getElementById('ce-city'));
  function openModal() { modal.hidden = false; }
  function closeModal() { modal.hidden = true; }
  createBtn.addEventListener('click', openModal);
  document.getElementById('ce-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  if (!createBtn.hidden) {
    const { ok: gOk, data: gData } = await api.groups.list({ limit: 50 });
    if (gOk) {
      gData.groups.filter(g => g.my_role === 'owner').forEach(g => {
        const opt = document.createElement('option'); opt.value = g.id; opt.textContent = g.name;
        document.getElementById('ce-group').appendChild(opt);
      });
    }
  }

  document.getElementById('ce-submit').addEventListener('click', async () => {
    const title = document.getElementById('ce-title').value.trim();
    const dateVal = document.getElementById('ce-date').value;
    if (title.length < 2) { showToast('Event title must be at least 2 characters.', 'error'); return; }
    if (!dateVal) { showToast('Event date is required.', 'error'); return; }
    const state = document.getElementById('ce-state').value;
    const location = getCityLocation();
    const groupId = document.getElementById('ce-group').value;
    const description = document.getElementById('ce-description').value.trim();

    const submitBtn = document.getElementById('ce-submit');
    submitBtn.disabled = true;
    const { ok, data } = await api.events.create({
      title, event_date: new Date(dateVal).toISOString(),
      state: state || undefined, location: location || undefined,
      group_id: groupId || undefined, description: description || undefined,
    });
    submitBtn.disabled = false;
    if (ok) { window.location.href = `/Dashboard/Event.html?id=${data.id}`; }
    else showToast(data?.error || 'Could not create event.', 'error');
  });

  loadPage(true);
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
