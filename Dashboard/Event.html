<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — Fantasi</title>

<link rel="stylesheet" href="https://use.typekit.net/ija6lho.css">

<style>
  :root{
    --noir:#0B0A0C; --noir-soft:#100E11; --emerald:#0F241C;
    --gold:#C7A65C; --gold-bright:#E4C687; --gold-dim:#7C6636;
    --silver:#A6ABB1; --silver-bright:#D4D7DB; --silver-dim:#5E6267;
    --bordeaux:#4E1220; --bordeaux-bright:#711A2E;
    --cream:#F2ECDF; --smoke:#8D8579; --smoke-dim:#5C564C;
    --line: rgba(199,166,92,0.14); --line-strong: rgba(199,166,92,0.30);
    --online: #7FBF8F;
    --font-serif: elina, sans-serif;
    --font-display: the-seasons, sans-serif;
    --font-header: garamond-premier-pro-display, serif;
    --font-sans: garamond-premier-pro-display, serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--noir); color:var(--cream);
    font-family:var(--font-serif); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2{ font-family:var(--font-display); font-style:italic; font-weight:300; margin:0; }
  h3{ font-family:var(--font-serif); font-weight:400; margin:0; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::selection{ background:var(--gold-dim); color:var(--noir); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 24px;
    font-family:var(--font-sans); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:500;
    border:1px solid var(--gold); border-radius:999px; transition:transform .3s ease, background .3s ease, border-color .3s ease, color .3s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn-gold{ background:var(--gold); color:var(--noir); }
  .btn-gold:hover{ background:var(--gold-bright); border-color:var(--gold-bright); }
  .btn-line{ background:transparent; color:var(--cream); border-color:var(--line-strong); }
  .btn-line:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-bordeaux{ border-color:var(--bordeaux-bright); color:var(--bordeaux-bright); }
  .btn-bordeaux:hover{ background:rgba(113,26,46,0.12); }
  .btn-small{ padding:8px 16px; font-size:10px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
  .btn.active{ background:var(--gold); color:var(--noir); }

  .luxury-grain{
    position:fixed; inset:0; z-index:9990; pointer-events:none;
    opacity:0.04; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex-shrink:0; background:var(--noir-soft); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-section{ padding:22px 20px; border-bottom:1px solid var(--line); }
  .sidebar-section h4{
    font-family:var(--font-sans); font-size:10px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:500; margin-bottom:14px;
  }
  .sidebar-stat{ display:flex; justify-content:space-between; font-family:var(--font-sans); font-size:12.5px; color:var(--smoke); margin-bottom:8px; }
  .sidebar-stat strong{ color:var(--cream); }

  .sidebar-foot{ padding:18px 16px; border-top:1px solid var(--line); margin-top:auto; }
  .mini-account{ display:flex; align-items:center; gap:11px; }
  .mini-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-size:15px; color:var(--noir);
  }
  .mini-account-name{ font-family:var(--font-sans); font-size:13px; color:var(--cream); }
  .mini-account-tier{ font-family:var(--font-sans); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gold); margin-top:1px; }

  .main{ flex:1; min-width:0; padding:44px 56px 80px; }
  .main-inner{ max-width:900px; }

  .event-hero{
    border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; margin-bottom:28px;
    background:var(--noir-soft); padding:28px;
  }
  .event-hero-badge{
    display:inline-block; font-family:var(--font-sans); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--gold-dim); border:1px solid var(--line-strong); border-radius:20px; padding:3px 10px; margin-bottom:12px;
  }
  .event-hero-title{ font-size:28px; margin-bottom:10px; }
  .event-hero-meta{ font-family:var(--font-sans); font-size:13px; color:var(--smoke); margin-bottom:6px; }
  .event-hero-organizer{ font-family:var(--font-sans); font-size:12.5px; color:var(--smoke-dim); margin-bottom:18px; }
  .rsvp-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .section{ margin-bottom:32px; }
  .section h2{ font-size:19px; margin-bottom:12px; }
  .event-desc{ font-family:var(--font-sans); font-size:14px; color:var(--smoke); line-height:1.7; }

  .empty{ font-family:var(--font-sans); font-size:13px; color:var(--smoke-dim); padding:16px 0; }

  .attendee-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .attendee-item{ display:flex; align-items:center; gap:8px; }
  .attendee-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-size:13px; color:var(--noir);
  }
  .attendee-name{ font-family:var(--font-sans); font-size:12.5px; color:var(--cream); }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .main{ padding:32px 22px 60px; }
  }
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="api-base" content="/api">
<script src="/js/fantasi-api.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasi">
<link rel="apple-touch-icon" href="/LandingPage/videos/fantasi-logo-gold.png">
</head>
<body>

<div class="luxury-grain"></div>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Details</h4>
      <div class="sidebar-stat"><span>Going</span><strong id="sb-going">—</strong></div>
      <div class="sidebar-stat"><span>Interested</span><strong id="sb-interested">—</strong></div>
      <div class="sidebar-stat"><span>Location</span><strong id="sb-location">—</strong></div>
    </div>
    <div class="sidebar-section" id="organizer-tools-section" hidden>
      <h4>Organizer Tools</h4>
      <button type="button" class="btn btn-line btn-small" id="edit-event-btn" style="width:100%; margin-bottom:8px;">Edit Event</button>
      <button type="button" class="btn btn-bordeaux btn-small" id="delete-event-btn" style="width:100%;">Delete Event</button>
    </div>

    <div class="sidebar-foot">
      <div class="mini-account">
        <div class="mini-avatar"></div>
        <div>
          <div class="mini-account-name">Loading…</div>
          <div class="mini-account-tier"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner" id="event-main">
      <p class="empty">Loading event…</p>
    </div>
  </main>
</div>

<script>
(async () => {
  if (!window.FantasiAPI) { window.location.href = '/SignInProcess/SignIn.html'; return; }
  const { api, initDashboard, showToast, initials } = window.FantasiAPI;

  const user = await initDashboard();
  if (!user) return;

  const eventId = new URLSearchParams(window.location.search).get('id');
  const mainEl = document.getElementById('event-main');
  if (!eventId) { mainEl.innerHTML = '<p class="empty">No event specified.</p>'; return; }

  const { ok, data: ev } = await api.events.get(eventId);
  if (!ok) { mainEl.innerHTML = `<p class="empty">${ev?.error || 'Event not found.'}</p>`; return; }

  document.title = `${ev.title} — Fantasi`;
  document.getElementById('sb-going').textContent = ev.going_count;
  document.getElementById('sb-interested').textContent = ev.interested_count;
  document.getElementById('sb-location').textContent = ev.location || ev.state || '—';

  mainEl.innerHTML = '';

  const hero = document.createElement('div');
  hero.className = 'event-hero';

  if (ev.group_name) {
    const badge = document.createElement('div'); badge.className = 'event-hero-badge';
    badge.textContent = `Hosted by ${ev.group_name}`;
    hero.appendChild(badge);
  }

  const title = document.createElement('h1'); title.className = 'event-hero-title'; title.textContent = ev.title;
  hero.appendChild(title);

  const d = new Date(ev.event_date);
  const meta = document.createElement('div'); meta.className = 'event-hero-meta';
  meta.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  hero.appendChild(meta);

  if (ev.location || ev.state) {
    const loc = document.createElement('div'); loc.className = 'event-hero-meta'; loc.textContent = ev.location || ev.state;
    hero.appendChild(loc);
  }

  const organizer = document.createElement('div'); organizer.className = 'event-hero-organizer';
  organizer.textContent = `Organized by ${ev.organizer_name}`;
  hero.appendChild(organizer);

  const rsvpRow = document.createElement('div'); rsvpRow.className = 'rsvp-row';
  const goingBtn = document.createElement('button');
  goingBtn.type = 'button'; goingBtn.className = 'btn btn-small ' + (ev.my_status === 'going' ? 'active' : 'btn-line');
  goingBtn.textContent = 'Going';
  const interestedBtn = document.createElement('button');
  interestedBtn.type = 'button'; interestedBtn.className = 'btn btn-small ' + (ev.my_status === 'interested' ? 'active' : 'btn-line');
  interestedBtn.textContent = 'Interested';

  async function setRsvp(status) {
    if (ev.my_status === status) {
      const { ok, data } = await api.events.cancelRsvp(eventId);
      if (!ok) { showToast(data?.error || 'Could not update RSVP.', 'error'); return; }
      ev.my_status = null;
    } else {
      const { ok, data } = await api.events.rsvp(eventId, status);
      if (!ok) { showToast(data?.error || 'Could not update RSVP.', 'error'); return; }
      ev.my_status = status;
    }
    goingBtn.className = 'btn btn-small ' + (ev.my_status === 'going' ? 'active' : 'btn-line');
    interestedBtn.className = 'btn btn-small ' + (ev.my_status === 'interested' ? 'active' : 'btn-line');
  }
  goingBtn.addEventListener('click', () => setRsvp('going'));
  interestedBtn.addEventListener('click', () => setRsvp('interested'));
  rsvpRow.append(goingBtn, interestedBtn);
  hero.appendChild(rsvpRow);

  mainEl.appendChild(hero);

  if (ev.organizer_id === user.id) {
    document.getElementById('organizer-tools-section').hidden = false;
  }

  const descSection = document.createElement('div');
  descSection.className = 'section';
  descSection.innerHTML = `<h2>About this event</h2><p class="event-desc"></p>`;
  descSection.querySelector('p').textContent = ev.description || 'No description has been written for this event yet.';
  mainEl.appendChild(descSection);

  const attendeesSection = document.createElement('div');
  attendeesSection.className = 'section';
  attendeesSection.innerHTML = `<h2>Who's going</h2><div class="attendee-grid" id="attendee-grid"></div>`;
  mainEl.appendChild(attendeesSection);

  const { ok: attOk, data: attData } = await api.events.attendees(eventId, 1);
  const attGrid = document.getElementById('attendee-grid');
  const going = attOk ? attData.attendees.filter(a => a.status === 'going') : [];
  if (going.length) {
    going.forEach(a => {
      const item = document.createElement('div'); item.className = 'attendee-item';
      const avatar = document.createElement('div'); avatar.className = 'attendee-avatar';
      if (a.avatar_url) avatar.style.backgroundImage = `url(${a.avatar_url})`;
      else avatar.textContent = initials(a.display_name);
      const nm = document.createElement('span'); nm.className = 'attendee-name'; nm.textContent = a.display_name;
      item.append(avatar, nm);
      attGrid.appendChild(item);
    });
  } else {
    attGrid.innerHTML = '<p class="empty">No one has RSVP\'d yet — be the first.</p>';
  }

  document.getElementById('delete-event-btn')?.addEventListener('click', async () => {
    if (!window.confirm('Delete this event? This cannot be undone.')) return;
    const { ok, data } = await api.events.remove(eventId);
    if (ok) window.location.href = '/Dashboard/Events.html';
    else showToast(data?.error || 'Could not delete event.', 'error');
  });
  document.getElementById('edit-event-btn')?.addEventListener('click', () => {
    const newTitle = window.prompt('Event title:', ev.title);
    if (newTitle === null || !newTitle.trim()) return;
    api.events.update(eventId, { title: newTitle.trim() }).then(({ ok, data }) => {
      if (ok) window.location.reload();
      else showToast(data?.error || 'Could not update event.', 'error');
    });
  });
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
