<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kink Dictionary — Fantasi</title>

<link rel="stylesheet" href="https://use.typekit.net/ija6lho.css">

<style>
  :root{
    --noir:#0B0A0C; --noir-soft:#100E11; --emerald:#0F241C;
    --gold:#C7A65C; --gold-bright:#E4C687; --gold-dim:#7C6636;
    --silver:#A6ABB1; --silver-bright:#D4D7DB; --silver-dim:#5E6267;
    --bordeaux:#4E1220; --bordeaux-bright:#711A2E;
    --cream:#F2ECDF; --smoke:#8D8579; --smoke-dim:#5C564C;
    --line: rgba(199,166,92,0.14); --line-strong: rgba(199,166,92,0.30);
    --online: #7FBF8F;
    --font-serif: elina, sans-serif;
    --font-display: the-seasons, sans-serif;
    --font-header: garamond-premier-pro-display, serif;
    --font-sans: garamond-premier-pro-display, serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--noir); color:var(--cream);
    font-family:var(--font-serif); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2{ font-family:var(--font-display); font-style:italic; font-weight:300; margin:0; }
  h3{ font-family:var(--font-serif); font-weight:400; margin:0; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  ::selection{ background:var(--gold-dim); color:var(--noir); }

  .eyebrow{
    font-family:var(--font-header); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }

  .luxury-grain{
    position:fixed; inset:0; z-index:9990; pointer-events:none;
    opacity:0.04; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }

  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex-shrink:0; background:var(--noir-soft); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-section{ padding:22px 20px; border-bottom:1px solid var(--line); }
  .sidebar-section h4{
    font-family:var(--font-sans); font-size:10px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:500; margin-bottom:14px;
  }
  .sidebar-field input, .sidebar-field select{
    appearance:none; -webkit-appearance:none; color-scheme:dark;
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line-strong); border-radius:6px;
    padding:9px 12px; color:var(--cream); font-family:var(--font-sans); font-size:12.5px; outline:none;
  }
  .sidebar-field select option{ background:var(--noir-soft); }
  .az-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; }
  .az-btn{
    text-align:center; padding:6px 0; border-radius:4px; font-family:var(--font-sans); font-size:11.5px;
    color:var(--smoke); transition:background .2s ease, color .2s ease;
  }
  .az-btn:hover{ background:rgba(199,166,92,0.08); color:var(--gold-bright); }
  .az-btn:disabled{ color:var(--smoke-dim); opacity:0.35; cursor:not-allowed; }
  .az-btn.active{ background:var(--gold); color:var(--noir); }

  .sidebar-foot{ padding:18px 16px; border-top:1px solid var(--line); margin-top:auto; }
  .mini-account{ display:flex; align-items:center; gap:11px; }
  .mini-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-style:italic; font-size:15px; color:var(--noir);
  }
  .mini-account-name{ font-family:var(--font-sans); font-size:13px; color:var(--cream); }
  .mini-account-tier{ font-family:var(--font-sans); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gold); margin-top:1px; }

  .main{ flex:1; min-width:0; padding:44px 56px 80px; }
  .main-inner{ max-width:820px; }

  .page-head{ margin-bottom:24px; }
  .page-head h1{ font-size:32px; margin-bottom:6px; }
  .page-head p{ font-family:var(--font-sans); font-size:14px; color:var(--smoke); }

  .empty{ font-family:var(--font-sans); font-size:13px; color:var(--smoke-dim); padding:40px 0; text-align:center; }

  .term-group{ margin-bottom:28px; }
  .term-group-letter{
    font-family:var(--font-display); font-style:italic; font-size:22px; color:var(--gold-bright);
    border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:12px;
  }
  .term-entry{ padding:14px 0; border-bottom:1px solid var(--line); scroll-margin-top:100px; }
  .term-entry:last-child{ border-bottom:none; }
  .term-name{ font-size:17px; color:var(--cream); margin-bottom:5px; }
  .term-cat{ display:inline-block; font-family:var(--font-sans); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold-dim); border:1px solid var(--line-strong); border-radius:20px; padding:2px 9px; margin-bottom:6px; }
  .term-def{ font-family:var(--font-sans); font-size:13.5px; color:var(--smoke); line-height:1.7; }

  @media (max-width:900px){
    .sidebar{ display:none; }
    .main{ padding:32px 22px 60px; }
  }
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="api-base" content="/api">
<script src="/js/fantasi-api.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasi">
<link rel="apple-touch-icon" href="/LandingPage/videos/fantasi-logo-gold.png">
</head>
<body>

<div class="luxury-grain"></div>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-section">
      <h4>Search</h4>
      <div class="sidebar-field">
        <input id="term-search" type="text" placeholder="Search terms…">
      </div>
    </div>
    <div class="sidebar-section">
      <h4>Category</h4>
      <div class="sidebar-field">
        <select id="cat-filter"><option value="">All categories</option></select>
      </div>
    </div>
    <div class="sidebar-section">
      <h4>Jump to</h4>
      <div class="az-grid" id="az-grid"></div>
    </div>

    <div class="sidebar-foot">
      <div class="mini-account">
        <div class="mini-avatar"></div>
        <div>
          <div class="mini-account-name">Loading…</div>
          <div class="mini-account-tier"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">

      <div class="page-head">
        <span class="eyebrow">Resources</span>
        <h1 style="margin-top:10px;">Kink Dictionary</h1>
        <p>Plain-language definitions for terms used across Fantasi and the community.</p>
      </div>

      <div id="dict-root"><p class="empty">Loading…</p></div>

    </div>
  </main>
</div>

<script>
(async () => {
  if (!window.FantasiAPI) { window.location.href = '/SignInProcess/SignIn.html'; return; }
  const { initDashboard, api } = window.FantasiAPI;

  const user = await initDashboard();
  if (!user) return;

  const searchEl = document.getElementById('term-search');
  const catEl    = document.getElementById('cat-filter');
  const azGrid   = document.getElementById('az-grid');
  const root     = document.getElementById('dict-root');

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'az-btn'; btn.textContent = letter; btn.disabled = true;
    btn.addEventListener('click', () => {
      const target = document.getElementById(`letter-${letter}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    azGrid.appendChild(btn);
  });

  let allTerms = [];

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const cat = catEl.value;
    let terms = allTerms;
    if (cat) terms = terms.filter(t => t.category === cat);
    if (q) terms = terms.filter(t => t.term.toLowerCase().includes(q) || t.definition.toLowerCase().includes(q));

    root.innerHTML = '';
    if (!terms.length) { root.innerHTML = '<p class="empty">No terms match your search.</p>'; return; }

    const availableLetters = new Set(terms.map(t => (t.term[0] || '').toUpperCase()));
    azGrid.querySelectorAll('.az-btn').forEach(btn => { btn.disabled = !availableLetters.has(btn.textContent); });

    let currentLetter = null;
    let groupEl = null;
    terms.forEach(term => {
      const letter = (term.term[0] || '#').toUpperCase();
      if (letter !== currentLetter) {
        currentLetter = letter;
        groupEl = document.createElement('div');
        groupEl.className = 'term-group';
        groupEl.id = `letter-${letter}`;
        const heading = document.createElement('div'); heading.className = 'term-group-letter'; heading.textContent = letter;
        groupEl.appendChild(heading);
        root.appendChild(groupEl);
      }
      const entry = document.createElement('div');
      entry.className = 'term-entry';
      entry.id = `term-${term.slug}`;
      if (term.category) {
        const cat = document.createElement('span'); cat.className = 'term-cat'; cat.textContent = term.category;
        entry.appendChild(cat);
        entry.appendChild(document.createElement('br'));
      }
      const name = document.createElement('div'); name.className = 'term-name'; name.textContent = term.term;
      const def = document.createElement('div'); def.className = 'term-def'; def.textContent = term.definition;
      entry.append(name, def);
      groupEl.appendChild(entry);
    });
  }

  const { ok, data } = await api.resources.dictionary();
  if (!ok) { root.innerHTML = '<p class="empty">Could not load the dictionary.</p>'; return; }
  allTerms = data.slice().sort((a, b) => a.term.localeCompare(b.term));

  const categories = [...new Set(allTerms.map(t => t.category).filter(Boolean))].sort();
  categories.forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    catEl.appendChild(opt);
  });

  searchEl.addEventListener('input', render);
  catEl.addEventListener('change', render);
  render();

  // Deep link from search results / elsewhere: ?term=<slug>
  const wantedSlug = new URLSearchParams(window.location.search).get('term');
  if (wantedSlug) {
    setTimeout(() => {
      const el = document.getElementById(`term-${wantedSlug}`);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.background = 'rgba(199,166,92,0.08)'; }
    }, 100);
  }
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
